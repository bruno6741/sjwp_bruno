<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        .Named{
            color:crimson;
        }
        .Hex{
            color: #53cfd3;
        }
        .RGB{
            color:rgb(0, 255, 242);
         /*   color: rgba(0, 255, 31, 0.5); */
        }
        .HSL{
            color: hsl(241, 67, 67);
        }
    </style>
</head>
<body>
    <h1>Boje u HTML-u</h1>
    <h3 class="Named">Named color</h3>
    <h3 class="Hex">Hex color</h3>
    <h3 class="RGB">RGB color</h3>
    <h3 class="HSL">HSL color</h3>
</body>
</html>
