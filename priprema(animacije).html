<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priprema</title>
    <style>
        .a{
            width: 100px;
            height: 50px;
            background-color: grey;
            border: 1px solid black;
            padding: 5px;
            margin: 50px;
            animation: 2s zibi ease 0s infinite alternate running;
        }
        @keyframes zibi {
            100%{
                transform: scale(150%);
            }
        }
        .b{
            width: 200px;
            height: 200px;
            animation: 4s zibi2 ease 0s infinite running;
            border: 1px solid black;
        }
        @keyframes zibi2 {
            0%{
                background-color: red;
            }
            25%{
                background-color: blue;
            }
            75%{
                background-color: green;
            }
            100%{
                background-color: red;
            }

        }
        .z{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid black;
            background-color: blue;
            margin: 50px;
            animation: 3s mov ease infinite alternate running;
        }
        @keyframes mov {
            100%{
                transform: translateX(300px);
            }
        }
        .m{
            width: 150px;
            height: 50px;
            border: 5px solid black;
            background-color: grey;
            padding: 5px;
            transition: transform, background-color, box-shadow, 0.5s ;
        }
        .m:hover{
            transform: scale(120%);
            background-color: white;
            box-shadow: 0px 0px 15px 3px rgba(0,0,0,0.4);
        }
       .k{
        border: 5px solid black;
        background-color: grey;
        width: 100px;
        height: 100px;
        margin: 20px;
        animation: 2s rot ease infinite running;
       }
       @keyframes rot {
            100%{
                transform: rotate(360deg);
            }
       }
       .c{
            width: 50px;
            height: 50px;
            border: 5px solid black;
            border-radius: 50%;
            border-top: 5px solid transparent;
            animation: 1s load ease 0s infinite running;
            margin: 20px;
        }
        @keyframes load {
            100%{
                transform: rotate(360deg);
            }
        }
        .d{
            width: 150px;
            height: 50px;
            border: 2px solid black;
            background-color: grey;
            padding: 5px;  
            color: white;
            text-align: center;
            margin-left:100px ; 
            margin-top: 25px;

      
        }
    </style>
</head>
<body>
    <div class="a"><p>klikni</p></div>
    <div class="b"></div>
    <div class="z"></div>
    <div class="m"><p>a</p></div>
    <div class="k"></div>
    <div class="c"></div>
    <div class="d"><p>Tekst</p></div>
</body>
</html>
