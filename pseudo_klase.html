<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Klase</title>
    <link rel="stylesheet" href="./pseudo_klase.css">
    <style>
        div{
            width: 250px;
            height: 250px;
            background-color: aqua;
        }
        div:hover{
            width: 500px;
        }
        a:link{
            color: red;
        }
        a:visited{
            color: green;
        }
        a:hover{
            color: hotpink;
        }
        a:active{
            color: chocolate;
        }
    </style>
</head>
<body>
    <h1>Pseudo Klase</h1>
    <a href="https://marvel.com">Marvel</a>
    <div></div>
</body>
</html>
