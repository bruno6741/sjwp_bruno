<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }
        .container{
            display: grid;
        }
        .header{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu{
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero{
            background-color: dodgerblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            background-color: darkblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner{
            background-color: rgb(255, 249, 143);
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }
        .extra{
            background-color: rgb(50, 205, 133);
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }
        .image{
            background-color:rgb(173, 255, 206);
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }
        @media (max-width: 320px){
            .container{
                grid-template-columns: 100vw;
                grid-template-rows: 5vh 5vh 22.5vh 22.5vh 15vh 15vh 15vh;
            }
            .header{
                grid-row: 1;
                grid-column: 1;
            }
            .menu{
                grid-row: 2;
                grid-column: 1;
            }
            .hero{
                grid-row: 3;
                grid-column: 1;
            }
            .main{
                grid-row: 4;
                grid-column: 1;
            }
            .banner{
                grid-row: 5;
                grid-column: 1;
            }
            .extra{
                grid-row: 6;
                grid-column: 1;
            }
            .image{
                grid-row: 7;
                grid-column: 1;
            }
        }
        @media (min-width: 321px) and (max-width: 768px){
            .container{
                grid-template-columns: 25vw 50vw 25vw;
                grid-template-rows: 10vh 30vh 30vh 15vh 15vh;
            }
            .header{
                grid-row: 1;
                grid-column: 1;
                width: 100vw;
            }
            .menu{
                grid-row: 3;
                grid-column: 1;
                height: 100vh;
            }
            .hero{
                grid-row: 2;
                grid-column: 1;
                width: 100vw;
            }
            .main{
                grid-row: 3;
                grid-column: 2;
                width: 100vw;
            }
            .banner{
                grid-row: 4;
                grid-column: 2;
                width: 100vw;
            }
            .extra{
                grid-row: 5;
                grid-column: 2;
            }
            .image{
                grid-row: 5;
                grid-column: 3;
            }
        }
        @media (min-width: 769px){
            .container{
                grid-template-columns: 25vw 25vw 25vw 25vw;
                grid-template-rows: 7vh 40vh 13vh 13vh 10vh;
            }
            .header{
                grid-row: 1;
                grid-column: 1;
            }
            .menu{
                grid-row: 1;
                grid-column: 2;
                width: 75vw;
            }
            .hero{
                grid-row: 2;
                grid-column: 1;
                width: 100vw;
            }
            .main{
                grid-row: 3;
                grid-column: 1;
                width: 50vw;
                height: 26vh;
            }
            .banner{
                grid-row: 5;
                grid-column: 1;
                width: 100vw;
            }
            .extra{
                grid-row: 4;
                grid-column: 4;
            }
            .image{
                grid-row: 3;
                grid-column: 4;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="menu">MENU</div>
        <div class="hero">HERO</div>
        <div class="main">MAIN</div>
        <div class="banner">BANNER</div>
        <div class="extra">EXTRA</div>
        <div class="image">IMAGE</div>
    </div>
</body>
</html>
