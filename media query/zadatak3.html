<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadatak 3</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

body {
  background: #ddd;
  font-family: sans-serif;
}

.container {
  display: grid;
  gap: 10px;
  padding: 20px;
}

/* BOJE */
.header { background: #ef6b6b; }
.main   { background: #e5e5e5; }
.left   { background: #e6c85c; }
.right  { background: #b6d96c; }
.footer { background: #6aa7c9; }

.container > * {
  padding: 40px;
  text-align: center;
  font-size: 20px;
}

.container {
  grid-template-areas:
    "header"
    "main"
    "left"
    "right"
    "footer";
}

.header {
     grid-area: header;
    }
.main   {
     grid-area: main;
    }
.left   {
     grid-area: left;
    }
.right  {
     grid-area: right; 
    }
.footer {
     grid-area: footer; 
    }

@media (min-width: 768px) {
  .container {
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "header header"
      "main   main"
      "left   right"
      "footer footer";
  }
}

@media (min-width: 1024px) {
  .container {
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-areas:
      "header header header"
      "left   main   right"
      "footer footer footer";
  }
}
    </style>
</head>
<body>

<div class="container">
  <header class="header">Header</header>
  <main class="main">Main</main>
  <aside class="left">Left</aside>
  <aside class="right">Right</aside>
  <footer class="footer">Footer</footer>
</div>

</body>
</html>
