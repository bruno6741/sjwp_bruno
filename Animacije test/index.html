<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ispitna</title>
    <style>
        .prvi{
            border: 5px solid black;
            height: 50px;
            width: 50px;
            border-radius: 50%;
            animation: 2s pulse ease alternate infinite;
            margin: 20px;
        }
        @keyframes pulse {
            100%{
                scale: 1.3;
            }
        }
        .drugi{
            width: 100px;
            height: 100px;
            padding-top:50px;
            text-align: center;
            font-size: 20px;
            animation: 3s dis ease alternate infinite;
        }
        @keyframes dis {
            100%{
                opacity: 0%;
            }
        }
        .treci{
            width: 100px;
            height: 100px;
            border: 5px solid black;
            animation: 1.8s tra ease alternate infinite;
        }
        @keyframes tra {
            100%{
                transform: translateY(50px);
            }
        }
        .cetvrti{
            margin-top: 100px;
            width: 70px;
            height: 50px;
            border: 5px solid black;
            text-align: center;
            transition: transform, background-color, 0.5s;
            margin-left: 20px;
        }
        .cetvrti:hover{
            transform: scale(1.2);
            background-color:cornflowerblue;
        }
        .peti{
            margin: 5px;
            width: 200px;
            height: 100px;
        }
        .peti1{
            margin: 5px;
            width: 10px;
            height: 10px;
            border: 5px solid black;
            border-radius: 50%;
            background-color: black;
            animation: 2s anim ease alternate infinite 2s;
            
        }
        .peti2{
            margin: 5px;
            width: 10px;
            height: 10px;
            border: 5px solid blue;
            border-radius: 50%;
            background-color: blue;
            animation: 2s anim ease alternate infinite 3s;
        }
        .peti3{
            margin: 5px;
            width: 10px;
            height: 10px;
            border: 5px solid red;
            border-radius: 50%;
            background-color: red;
            animation: 2s anim ease alternate infinite 4s;
        }
        @keyframes anim {
            100%{
                opacity: 0%;
            }
        }
    </style>
</head>
<body>
    <div class="prvi"></div>
    <div class="drugi">Tekst</div>
    <div class="treci"></div>
    <div class="cetvrti">Gumb</div>
    <div class="peti">
        <div class="peti1"></div>
        <div class="peti2"></div>
        <div class="peti3"></div>
    </div>
</body>
</html>
