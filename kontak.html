<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt Forma</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
        }

        .contact-form {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 60px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0d6efd;
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            background-color: #0d6efd;
            color: white;
            border-radius: 10px;
            padding: 10px 25px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #084298;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="contact-form">
                    <h2>Kontaktirajte Nas</h2>

                    <form method="GET">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ime" class="form-label">Ime</label>
                                <input type="text" class="form-control" id="ime" name="ime" placeholder="Unesite ime">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Unesite email">
                            </div>
                        </div>

                
                        <div class="mb-3">
                            <label for="datum" class="form-label">Datum</label>
                            <input type="date" class="form-control" id="datum" name="datum">
                        </div>

                  
                        <div class="mb-3">
                            <label for="poruka" class="form-label">Poruka</label>
                            <textarea class="form-control" id="poruka" name="poruka" rows="5" placeholder="Unesite vašu poruku"></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-custom">
                                Pošalji Poruku
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
