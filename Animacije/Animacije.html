<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacije</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background: #0071ff;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            box-sizing: border-box;
            margin-left: 200px;
            margin-top: 200px;
            padding: 83px;

            animation-duration: 3s;
            animation-name: spin;
            animation-timing-function: ease;
            animation-delay: 0s;
            animation-iteration-count: infinite;/* infinite, broj */
            animation-direction: alternate;/* moze bit reverse, default i alternate */
            /* animation-fill-mode: forwards;/* Stane na kraj */ 
            animation-play-state: running;
            animation: 3s spin ease 0s infinite alternate running;/* ove sve naredbe gore se mogu zamijeniti s ovom */
        }
        div:hover{
            animation-play-state: paused;
        }

        

        @keyframes spin {
            0%{

            }
            50%{
                scale: 2;
                transform: rotate(0);
                border-radius: 0;
            }
            100%{
                scale: 2;
                transform: rotate(360deg);
                border-radius: 50%;
            }
        }
    </style>
</head>
<body>
    <h1>Animacije</h1>
    <div>Njac</div>
</body>
</html>
